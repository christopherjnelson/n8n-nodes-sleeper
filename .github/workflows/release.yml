# Manual-only by design; do not add automatic push or tag triggers.
name: Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release mode
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - trusted-stage
          - verify-published
      npm_dist_tag:
        description: npm distribution tag
        required: true
        type: choice
        default: next
        options:
          - next
          - latest
      package_confirmation:
        description: Type n8n-nodes-sleeper exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates and package inspection
    if: inputs.release_mode != 'verify-published'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.16.0

      - name: Verify release intent, package name, and source ref
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          PACKAGE_CONFIRMATION: ${{ inputs.package_confirmation }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$PACKAGE_CONFIRMATION" != "$package_name" ]]; then
            echo "::error::Package confirmation must exactly match $package_name"
            exit 1
          fi

          if [[ "$RELEASE_MODE" == "dry-run" ]]; then
            if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ]]; then
              echo "::error::Dry runs must use the main branch"
              exit 1
            fi
            exit 0
          fi

          if [[ "$RELEASE_MODE" != "trusted-stage" ]]; then
            echo "::error::Unsupported release mode: $RELEASE_MODE"
            exit 1
          fi

          expected_tag="v${package_version}"
          if [[ "$REF_TYPE" != "tag" || "$REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Trusted staging requires the exact tag $expected_tag"
            exit 1
          fi
          if [[ "$(git cat-file -t "$REF_NAME" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error::$REF_NAME must be an annotated tag"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$SELECTED_SHA" ]]; then
            echo "::error::Checked-out source does not match the selected workflow ref"
            exit 1
          fi
          if [[ "$(git rev-parse "${REF_NAME}^{commit}")" != "$SELECTED_SHA" ]]; then
            echo "::error::$REF_NAME does not point to the selected source commit"
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$SELECTED_SHA" ]]; then
            echo "::error::Release tag must point exactly to the freshly fetched origin/main commit"
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run official n8n validation
        run: pnpm run validate

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Run all tests
        run: pnpm run test

      - name: Build package
        run: pnpm run build

      - name: Run official source and built scanner
        run: pnpm run scan:source

      - name: Load compiled registrations
        run: pnpm run smoke:load

      - name: Install packed package in an isolated consumer
        run: pnpm run smoke:install

      - name: Run project package inspection
        run: pnpm run package:check

      - name: Reject an existing registry or staged version
        if: inputs.release_mode == 'trusted-stage'
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          set +e
          registry_result="$(npm view "${package_name}@${package_version}" version --json 2>&1)"
          registry_status=$?
          set -e
          if [[ $registry_status -eq 0 ]]; then
            echo "::error::${package_name}@${package_version} already exists on npm"
            exit 1
          fi
          if [[ "$registry_result" != *"E404"* ]]; then
            echo "$registry_result"
            echo "::error::Could not prove that the package version is unpublished"
            exit 1
          fi

          set +e
          npm stage list "$package_name" --json > /tmp/npm-stage-list.json 2> /tmp/npm-stage-list.err
          staged_status=$?
          set -e
          if [[ $staged_status -eq 0 ]]; then
            PACKAGE_NAME="$package_name" PACKAGE_VERSION="$package_version" node <<'NODE'
          const fs = require('node:fs');
          const staged = JSON.parse(fs.readFileSync('/tmp/npm-stage-list.json', 'utf8'));
          const duplicate = staged.some(
            (item) =>
              item.packageName === process.env.PACKAGE_NAME &&
              item.version === process.env.PACKAGE_VERSION,
          );
          if (duplicate) {
            console.error(
              `::error::${process.env.PACKAGE_NAME}@${process.env.PACKAGE_VERSION} is already staged`,
            );
            process.exit(1);
          }
          NODE
          else
            stage_error="$(</tmp/npm-stage-list.err)"
            if [[ "$stage_error" == *"E401"* || "$stage_error" == *"ENEEDAUTH"* || "$stage_error" == *"Unauthorized"* ]]; then
              echo "::warning::Staged-version listing requires interactive npm authentication; the registry will still atomically reject a duplicate version"
            else
              echo "$stage_error"
              echo "::error::Could not safely check existing staged versions"
              exit 1
            fi
          fi

      - name: Create and inspect exact package tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir release-artifact
          npm pack --json --pack-destination release-artifact > /tmp/npm-pack.json
          tarball="$(node -p "require('/tmp/npm-pack.json')[0].filename")"
          tar -tzf "release-artifact/${tarball}"
          sha256="$(sha256sum "release-artifact/${tarball}" | cut -d ' ' -f 1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Retain inspected package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball-${{ github.run_id }}
          path: release-artifact/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  trusted-stage:
    name: Trusted staged publication
    if: inputs.release_mode == 'trusted-stage'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.16.0

      - name: Download inspected tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball-${{ github.run_id }}
          path: package-tarball

      - name: Reverify inspected tarball
        env:
          EXPECTED_SHA256: ${{ needs.quality.outputs.sha256 }}
          PACKAGE_TARBALL: ./package-tarball/${{ needs.quality.outputs.tarball }}
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA256}  ${PACKAGE_TARBALL}" | sha256sum --check --strict
          tar -tzf "$PACKAGE_TARBALL"

      - name: Stage through npm trusted publishing
        env:
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          PACKAGE_TARBALL: ./package-tarball/${{ needs.quality.outputs.tarball }}
        run: npm stage publish "$PACKAGE_TARBALL" --provenance --access public --tag "$NPM_DIST_TAG"

  verify-published:
    name: Verify owner-approved publication
    if: inputs.release_mode == 'verify-published'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out selected tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install verification npm CLI
        run: npm install --global npm@11.16.0

      - name: Verify immutable tag and current main
        env:
          PACKAGE_CONFIRMATION: ${{ inputs.package_confirmation }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_CONFIRMATION" != "$package_name" ]]; then
            echo "::error::Package confirmation must exactly match $package_name"
            exit 1
          fi
          expected_tag="v${package_version}"
          if [[ "$REF_TYPE" != "tag" || "$REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Verification requires the exact tag $expected_tag"
            exit 1
          fi
          if [[ "$(git cat-file -t "$REF_NAME" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error::$REF_NAME must be an annotated tag"
            exit 1
          fi
          if [[ "$(git rev-parse "${REF_NAME}^{commit}")" != "$SELECTED_SHA" ]]; then
            echo "::error::$REF_NAME does not point to the selected source commit"
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$SELECTED_SHA" ]]; then
            echo "::error::Release tag must point exactly to the freshly fetched origin/main commit"
            exit 1
          fi

      - name: Install locked verification tooling
        run: pnpm install --frozen-lockfile

      - name: Verify registry metadata, stable tag, and provenance
        run: |
          set -euo pipefail
          npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version repository dist-tags.latest dist.attestations --json > /tmp/npm-release-metadata.json
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const metadata = JSON.parse(fs.readFileSync('/tmp/npm-release-metadata.json', 'utf8'));
          if (metadata.version !== pkg.version) throw new Error('Registry version mismatch');
          if (metadata['dist-tags.latest'] !== pkg.version) throw new Error('latest does not point to the stable release');
          const repository = metadata.repository?.url ?? metadata.repository;
          if (!String(repository).includes('github.com/christopherjnelson/n8n-nodes-sleeper')) throw new Error('Registry repository mismatch');
          if (metadata['dist.attestations']?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') throw new Error('SLSA provenance v1 is missing');
          NODE

      - name: Inspect, install, and load exact published package
        run: node scripts/published-package-smoke.mjs

      - name: Require exact official published scanner success
        run: pnpm run scan:published
