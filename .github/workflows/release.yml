name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates and package inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify annotated tag against current main
        run: node scripts/verify-release-tag.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run official n8n validation
        run: pnpm run validate

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Run all tests
        run: pnpm run test

      - name: Review node source
        run: pnpm run review:source

      - name: Build package
        run: pnpm run build

      - name: Run official source and built scanner
        run: pnpm run scan:source

      - name: Load compiled registrations
        run: pnpm run smoke:load

      - name: Install packed package in an isolated consumer
        run: pnpm run smoke:install

      - name: Run project package inspection
        run: pnpm run package:check

      - name: Audit release configuration
        run: pnpm run release:check

      - name: Reject an existing registry version
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          set +e
          registry_error="$(npm view "${package_name}@${package_version}" version --json 2>&1)"
          registry_status=$?
          set -e
          if [[ $registry_status -eq 0 ]]; then
            echo "::error::${package_name}@${package_version} already exists on npm"
            exit 1
          else
            if [[ "$registry_error" != *"E404"* ]]; then
              echo "$registry_error"
              echo "::error::Could not prove that the package version is unpublished"
              exit 1
            fi
          fi

      - name: Create and inspect exact package tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir release-artifact
          npm pack --json --pack-destination release-artifact > npm-pack.json
          tarball="$(node -p "require('./npm-pack.json')[0].filename")"
          tar -tzf "release-artifact/${tarball}"
          sha256="$(sha256sum "release-artifact/${tarball}" | cut -d ' ' -f 1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Retain inspected package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball-${{ github.run_id }}
          path: release-artifact/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable tag to npm
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare npm authentication for OIDC
        run: node scripts/prepare-npm-auth.mjs

      - name: Install pinned npm CLI
        run: npm install --global npm@11.19.0

      - name: Download inspected tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball-${{ github.run_id }}
          path: package-tarball

      - name: Reverify inspected tarball
        env:
          EXPECTED_SHA256: ${{ needs.quality.outputs.sha256 }}
          PACKAGE_TARBALL: ./package-tarball/${{ needs.quality.outputs.tarball }}
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA256}  ${PACKAGE_TARBALL}" | sha256sum --check --strict
          tar -tzf "$PACKAGE_TARBALL"

      - name: Publish with provenance to the stable tag
        env:
          PACKAGE_TARBALL: ./package-tarball/${{ needs.quality.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --provenance --access public --tag latest

  verify-published:
    name: Verify published package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install pinned npm CLI
        run: npm install --global npm@11.19.0

      - name: Install locked verification tooling
        run: pnpm install --frozen-lockfile

      - name: Require exact official published scanner success
        run: pnpm run scan:published

      - name: Verify registry metadata, latest tag, and provenance
        run: node scripts/verify-published-release.mjs

      - name: Inspect, install, and load exact published package
        run: pnpm run smoke:published

  github-release:
    name: Create GitHub Release
    needs: [quality, verify-published]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Create release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file CHANGELOG.md
